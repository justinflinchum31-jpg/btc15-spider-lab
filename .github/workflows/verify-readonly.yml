name: Verify read-only dashboard
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/replay.js
          node --check public/neon.js
          node --check public/spot.js
          node --check public/spot-home.js
          node --check netlify/functions/spot-market.mjs
      - name: Run market-data unit tests
        run: node --test tests/spot-market.test.mjs
      - name: Validate read-only policy
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const js = fs.readFileSync('public/app.js','utf8');
          const html = fs.readFileSync('public/index.html','utf8');
          const researchHtml = fs.readFileSync('public/research.html','utf8');
          const replayHtml = fs.readFileSync('public/replay.html','utf8');
          const replayJS = fs.readFileSync('public/replay.js','utf8');
          const neonJS = fs.readFileSync('public/neon.js','utf8');
          const neonCSS = fs.readFileSync('public/neon.css','utf8');
          const spotHTML = fs.readFileSync('public/spot.html','utf8');
          const spotJS = fs.readFileSync('public/spot.js','utf8');
          const spotHomeJS = fs.readFileSync('public/spot-home.js','utf8');
          const functionJS = fs.readFileSync('netlify/functions/spot-market.mjs','utf8');
          const toml = fs.readFileSync('netlify.toml','utf8');
          const ids = new Set([...researchHtml.matchAll(/id="([^"]+)"/g)].map(m=>m[1]));
          const requested = [...js.matchAll(/\$\('([^']+)'\)/g)].map(m=>m[1]);
          assert(requested.every(id => ids.has(id)),'Missing DOM ID');
          assert(!/\b(fetch|XMLHttpRequest|WebSocket|EventSource)\s*\(/.test(js + replayJS + neonJS),'Network use not allowed');
          assert(!/\b(wallet|placeOrder|submitOrder|executeTrade|paperTrade)\s*\(/i.test(js + replayJS + neonJS),'Trading action not allowed');
          assert(replayHtml.includes('Historical signal replay.') && replayJS.includes('const samples='),'Replay assets missing');
          assert(html.includes('neon.js') && html.includes('neon.css'),'Neon dashboard not the homepage');
          assert(neonCSS.includes('.status-grid') && neonCSS.includes('.market-chart'),'Neon styling missing');
          const neonIds = new Set([...html.matchAll(/id="([^"]+)"/g)].map(m=>m[1]));
          const needed = [...neonJS.matchAll(/\$\('([^']+)'\)/g)].map(m=>m[1]);
          assert(needed.every(id=>neonIds.has(id)),'Missing neon dashboard element');
          const packed = neonJS.match(/const PACK = "([^"]+)";/)?.[1];
          assert(packed && packed.split(';').length === 240,'Expected 240 archived OHLC candles');
          assert(toml.includes('publish = "public"'),'Unexpected publish dir');
          assert(toml.includes("connect-src 'self'"),'Same-origin-only CSP required');
          assert(html.includes('href="/spot.html"') && html.includes('spot-home.js'),'Spot interface link missing');
          assert(spotHTML.includes('/spot.js') && spotHTML.includes('spot-canvas'),'Spot charts missing');
          assert(spotJS.includes("'/api/spot-market?mode='") && spotHomeJS.includes("'/api/spot-market?mode=quote'"),'Only approved same-origin API calls allowed');
          assert(!/\b(walletConnect|placeOrder|submitOrder|executeTrade|paperTrade)\s*\(/i.test(spotJS + spotHomeJS + functionJS),'Trading capabilities not allowed');
          assert(functionJS.includes('https://api.exchange.coinbase.com/products/BTC-USD'),'Only public fixed BTC/USD endpoint allowed');
          assert.deepEqual(fs.readdirSync('netlify/functions').sort(),['spot-market.mjs'],'Only allowlisted market-data reader may be deployed');
          console.log('Read-only static checks passed');
          EOF
